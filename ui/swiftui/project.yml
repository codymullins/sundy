name: SundySwiftUI
options:
  bundleIdPrefix: com.sundy
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    CLANG_ENABLE_MODULES: YES
    ENABLE_PREVIEWS: YES
    PRODUCT_NAME: Sundy

packages: {}

schemes:
  SundySwiftUI-iOS:
    build:
      targets:
        SundySwiftUI-iOS: all
        SundySwiftUITests-iOS: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SundySwiftUITests-iOS
  SundySwiftUI-macOS:
    build:
      targets:
        SundySwiftUI-macOS: all
        SundySwiftUITests-macOS: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SundySwiftUITests-macOS

targets:
  SundySwiftUI-iOS:
    type: application
    platform: iOS
    sources:
      - path: SundyShared
      - path: SundySwiftUIiOS
      - path: SundySwiftUIiOS/Sundy.icon
        type: folder
        buildPhase: resources
    resources:
      - path: SundyShared/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sundy.sundy-ios
        INFOPLIST_KEY_CFBundleDisplayName: Sundy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreenName: ""
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: Sundy

  SundySwiftUI-macOS:
    type: application
    platform: macOS
    sources:
      - path: SundyShared
      - path: SundySwiftUIMac
      - path: SundySwiftUIMac/Sundy.icon
        type: folder
        buildPhase: resources
    resources:
      - path: SundyShared/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sundy.sundy-macos
        INFOPLIST_KEY_CFBundleDisplayName: Sundy
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: Sundy

  SundySwiftUITests-iOS:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: SundySwiftUI-iOS
    settings:
      base:
        PRODUCT_NAME: SundyTests
        PRODUCT_BUNDLE_IDENTIFIER: com.sundy.swiftui.tests.ios
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sundy.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Sundy
        BUNDLE_LOADER: $(TEST_HOST)

  SundySwiftUITests-macOS:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: SundySwiftUI-macOS
    settings:
      base:
        PRODUCT_NAME: SundyTests
        PRODUCT_BUNDLE_IDENTIFIER: com.sundy.swiftui.tests.macos
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sundy.app/Contents/MacOS/Sundy
        BUNDLE_LOADER: $(TEST_HOST)
