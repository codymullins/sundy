<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authentication Complete</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .success svg {
            margin-bottom: 20px;
        }
        h2 {
            margin: 0 0 12px 0;
            font-size: 24px;
            font-weight: 600;
        }
        p {
            margin: 0;
            color: #808080;
            font-size: 14px;
        }
        .error {
            color: #ef4444;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid #333;
            border-top-color: #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container" id="content">
        <div class="spinner"></div>
        <h2>Completing authentication...</h2>
        <p>Please wait</p>
    </div>

    <script>
        (async function() {
            const container = document.getElementById('content');

            // Platform detection
            function isTauri() {
                return typeof window.__TAURI__ !== 'undefined';
            }

            // Parse URL parameters
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const state = params.get('state');
            const error = params.get('error');
            const errorDescription = params.get('error_description');

            if (error) {
                container.innerHTML = `
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="15" y1="9" x2="9" y2="15"></line>
                        <line x1="9" y1="9" x2="15" y2="15"></line>
                    </svg>
                    <h2>Authentication Failed</h2>
                    <p class="error">${error}</p>
                    <p>${errorDescription || ''}</p>
                `;
                return;
            }

            if (!code) {
                container.innerHTML = `
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="15" y1="9" x2="9" y2="15"></line>
                        <line x1="9" y1="9" x2="15" y2="15"></line>
                    </svg>
                    <h2>Authentication Failed</h2>
                    <p class="error">No authorization code received</p>
                `;
                return;
            }

            try {
                console.log('Auth callback - isTauri:', isTauri(), 'code length:', code.length);

                if (isTauri()) {
                    // Tauri mode: emit event via Tauri
                    await window.__TAURI__.event.emit('oauth-callback', { code, state });
                    console.log('Emitted oauth-callback event via Tauri');
                } else {
                    // Browser mode: use postMessage to opener window
                    if (window.opener) {
                        window.opener.postMessage({
                            type: 'oauth-callback',
                            code: code,
                            state: state
                        }, window.location.origin);
                        console.log('Sent oauth-callback via postMessage');
                    } else {
                        throw new Error('No opener window found');
                    }
                }

                container.innerHTML = `
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    <h2>Authentication Complete</h2>
                    <p>This window will close automatically...</p>
                `;

                // Close window after short delay
                setTimeout(() => {
                    try {
                        if (isTauri()) {
                            const currentWindow = window.__TAURI__.window.getCurrentWindow();
                            currentWindow.close();
                        } else {
                            window.close();
                        }
                    } catch (e) {
                        console.log('Could not close window:', e);
                    }
                }, 1000);

            } catch (e) {
                console.error('Failed to send auth code:', e);
                container.innerHTML = `
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="15" y1="9" x2="9" y2="15"></line>
                        <line x1="9" y1="9" x2="15" y2="15"></line>
                    </svg>
                    <h2>Authentication Error</h2>
                    <p class="error">${e.message || 'Failed to complete authentication'}</p>
                `;
            }
        })();
    </script>
</body>
</html>
