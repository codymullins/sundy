name: Build Web (Blazor WASM)

on:
  push:
    branches: [main]
    paths:
      - 'src/Sundy.Tauri/**'
      - 'src/Sundy.Core/**'
      - '.github/workflows/tauri-build-web.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: src/Sundy.Tauri/Sundy
        run: dotnet restore src/Sundy.csproj

      - name: Publish Blazor WASM
        working-directory: src/Sundy.Tauri/Sundy
        run: dotnet publish src/Sundy.csproj -c Release -o dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blazor-wasm
          path: src/Sundy.Tauri/Sundy/dist/wwwroot
          retention-days: 14
