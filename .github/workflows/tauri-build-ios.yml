name: Build iOS

on:
  push:
    branches: [main]
    paths:
      - 'src/Sundy.Tauri/**'
      - 'src/Sundy.Core/**'
      - '.github/workflows/tauri-build-ios.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Add iOS target
        run: rustup target add aarch64-apple-ios

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Restore .NET dependencies
        working-directory: src/Sundy.Tauri/Sundy
        run: dotnet restore src/Sundy.csproj

      - name: Publish Blazor project
        working-directory: src/Sundy.Tauri/Sundy
        run: dotnet publish src/Sundy.csproj -c Release -o dist

      - name: Initialize iOS project
        working-directory: src/Sundy.Tauri/Sundy
        run: cargo tauri ios init

      - name: Build iOS app
        working-directory: src/Sundy.Tauri/Sundy
        run: cargo tauri ios build --target aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: src/Sundy.Tauri/Sundy/src-tauri/gen/apple/build/**/*.app
          retention-days: 14
