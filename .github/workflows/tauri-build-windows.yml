name: Build Windows

on:
  push:
    branches: [main]
    paths:
      - 'src/Sundy.Tauri/**'
      - 'src/Sundy.Core/**'
      - '.github/workflows/tauri-build-windows.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Restore .NET dependencies
        working-directory: src/Sundy.Tauri/Sundy
        run: dotnet restore src/Sundy.csproj

      - name: Publish Blazor project
        working-directory: src/Sundy.Tauri/Sundy
        run: dotnet publish src/Sundy.csproj -c Release -o dist

      - name: Build Tauri app
        working-directory: src/Sundy.Tauri/Sundy
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-${{ matrix.arch }}
          path: src/Sundy.Tauri/Sundy/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          retention-days: 14

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-${{ matrix.arch }}
          path: src/Sundy.Tauri/Sundy/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          retention-days: 14
